sonar.projectKey=notes-app
sonar.projectName=Notes App
sonar.sources=client/src,server/src
sonar.tests=client/src/__tests__,server/test
sonar.test.inclusions=**/*.test.js,**/*.test.jsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.png,**/*.jpg,**/*.jpeg,**/*.svg,**/*.gif
sonar.javascript.lcov.reportPaths=client/coverage/lcov.info,server/coverage/lcov.info
sonar.coverage.exclusions=**/generated/**,client/src/main.jsx,client/src/setupEnv.js,client/src/setupTests.js
sonar.host.url=http://localhost:9000
