sonar.projectKey=notes-app
sonar.projectName=Notes Application
sonar.projectVersion=1.0.0

sonar.sources=server/src,client/src
sonar.tests=server/test,client/src/__tests__
sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,client/coverage/lcov.info

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js
